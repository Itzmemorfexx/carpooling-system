{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0"><i class="fas fa-phone me-2"></i>Verify Phone Number</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        We'll send a verification code to your phone number: <strong>{{ user.profile.phone_number }}</strong>
                    </p>
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-1"></i>Send Verification Code
                        </button>
                        <a href="{% url 'profile' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i>Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
