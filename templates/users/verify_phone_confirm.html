{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0"><i class="fas fa-check-circle me-2"></i>Enter Verification Code</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        Please enter the 6-digit verification code sent to your phone number: <strong>{{ user.profile.phone_number }}</strong>
                    </p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="verification_code" class="form-label">Verification Code</label>
                            <input type="text" class="form-control form-control-lg" id="verification_code" 
                                   name="verification_code" maxlength="6" pattern="[0-9]{6}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check me-1"></i>Verify Code
                        </button>
                        <a href="{% url 'verify_phone' %}" class="btn btn-secondary">
                            <i class="fas fa-redo me-1"></i>Resend Code
                        </a>
                        <a href="{% url 'profile' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i>Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
